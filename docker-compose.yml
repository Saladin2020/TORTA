services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dice
      POSTGRES_PASSWORD: dice
      POSTGRES_DB: dice
    ports:
      - "5432:5432"
    volumes:
      - dice_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dice -d dice"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dice_pg:
